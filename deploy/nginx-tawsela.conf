# Wassal's site. A template: deploy/setup-server.sh and deploy/deploy.sh write it to
# /etc/nginx/sites-available/tawsela with __DOMAIN__ replaced, enabled as sites-enabled/zz-tawsela.
#   api.__DOMAIN__    the API (/v1), the live orders socket (/socket.io) and uploaded photos (/uploads)
#   admin.__DOMAIN__  the dashboard (admins and stores)
# One certificate covers both names; it is filed under api.__DOMAIN__.
# Rate limit per client address: nginx takes the first burst, then the API's own limits answer 429.
limit_req_zone $binary_remote_addr zone=tawsela_api:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.__DOMAIN__ admin.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/tawsela-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.__DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/api.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tawsela_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    # The live orders socket (socket.io at the API's root, not under /v1): kept open while the app is.
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    # Photo uploads (catalog images, the customer's photos, the profile photo): the API refuses more than 8 MB.
    location ~ ^/v1/(admin/uploads|me/uploads|me/avatar)$ {
        limit_req zone=tawsela_api burst=60 nodelay;
        client_max_body_size 10m;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        limit_req zone=tawsela_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4010;
        proxy_set_header Host $host;
        # Appends the real address; the API trusts only this last entry (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        alias /srv/tawsela/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        # The dashboard on admin.__DOMAIN__ shows these photos.
        add_header Cross-Origin-Resource-Policy "cross-origin";
    }

    location / {
        return 404;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.__DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/api.__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tawsela_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    # Built assets have hashed names: cached for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options "DENY";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "same-origin";
    }
}
