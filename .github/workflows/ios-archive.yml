# Builds the iPhone app of apps/mobile, unsigned. Runs only when started by hand.
# Outputs:
#   - an .xcarchive, for whoever publishes the app to sign under their Apple Developer account
#   - an unsigned .ipa, for testing once signed (e.g. with a free Apple ID through Sideloadly)
# Signing needs the publisher's Apple account, which is not decided yet (contract §15.1 #8).
name: iOS archive

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: API base URL baked into the app (defaults to the EXPO_PUBLIC_API_URL variable)
        required: false

concurrency:
  group: ios-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check the settings
        run: |
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::Pass api_url or set the EXPO_PUBLIC_API_URL repository variable"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set the build number
        run: echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the shared package
        run: pnpm --filter @tawsela/shared build

      - name: Generate the iOS project
        working-directory: apps/mobile
        run: npx expo prebuild --platform ios --clean

      - name: Archive (unsigned)
        working-directory: apps/mobile/ios
        run: |
          workspace="$(ls -d *.xcworkspace | head -1)"
          scheme="${workspace%.xcworkspace}"
          echo "SCHEME=$scheme" >> "$GITHUB_ENV"
          set -o pipefail
          xcodebuild archive \
            -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$scheme.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | grep -E '^(Compiling|Ld|error|warning: unable|\*\* )' || true
          test -d "$RUNNER_TEMP/$scheme.xcarchive/Products/Applications" || { echo "::error::The archive failed; see the log above"; exit 1; }

      - name: Pack the archive and an unsigned .ipa
        run: |
          mkdir -p out Payload
          ditto -c -k --keepParent "$RUNNER_TEMP/$SCHEME.xcarchive" "out/tawsela-${APP_BUILD_NUMBER}.xcarchive.zip"
          cp -R "$RUNNER_TEMP/$SCHEME.xcarchive/Products/Applications/"*.app Payload/
          zip -qry "out/tawsela-${APP_BUILD_NUMBER}-unsigned.ipa" Payload
          echo "Built iOS #${APP_BUILD_NUMBER} for ${EXPO_PUBLIC_API_URL} (unsigned)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tawsela-ios
          path: out/*
          retention-days: 14
