# Builds the signed Android App Bundle (.aab) for Google Play.
# Runs only when started by hand, for a release. A push never builds.
#
# Needs the upload key secrets (same as Android APK) and the repo variable EXPO_PUBLIC_API_URL
# set to the production API: a store build must never point at a local address.
name: Android AAB

on:
  workflow_dispatch:

concurrency:
  group: android-aab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      # Empty until the secret is set: the map picker then shows its stand-in (contract §8.9).
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check the release settings
        run: |
          # The build number is main's commit count: from another branch it could be lower or repeated,
          # and Google Play refuses the upload (review F56).
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Store builds run from main only (this is $GITHUB_REF)"; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo "::error::Set the EXPO_PUBLIC_API_URL repository variable to the production API"; exit 1; }
          case "$EXPO_PUBLIC_API_URL" in https://*/v1) ;; *) echo "::error::A store build needs the production API: https://<host>/v1"; exit 1 ;; esac
          case "$EXPO_PUBLIC_API_URL" in *localhost*|*127.0.0.1*|*10.0.2.2*|*192.168.*) echo "::error::A store build must not point at a local address"; exit 1 ;; esac

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The package ID can never change once on Google Play (contract §15.1 #8).
      - name: Check the app identity
        run: |
          if grep -q "com.placeholder" apps/mobile/app.config.ts; then
            echo "::error::Set the real app ID in apps/mobile/app.config.ts (IDENTITY.id) before a store build"
            exit 1
          fi

      - name: Set the build number
        run: echo "APP_BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the shared package
        run: pnpm --filter @tawsela/shared build

      - name: Write the Firebase file (push)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then echo "::warning::No GOOGLE_SERVICES_JSON_BASE64 secret: this build gets no push on Android"; exit 0; fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
          echo "GOOGLE_SERVICES_JSON=$RUNNER_TEMP/google-services.json" >> "$GITHUB_ENV"

      - name: Generate the Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Unpack the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Add the ANDROID_UPLOAD_KEYSTORE_BASE64 secret first"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the bundle
        working-directory: apps/mobile/android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Name the bundle
        run: |
          mkdir -p out
          cp apps/mobile/android/app/build/outputs/bundle/release/app-release.aab "out/tawsela-${APP_BUILD_NUMBER}.aab"
          echo "Built AAB #${APP_BUILD_NUMBER} for ${EXPO_PUBLIC_API_URL}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tawsela-android-aab
          path: out/*.aab
          retention-days: 30
